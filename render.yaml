# ==============================================================================
#                 SYNOVA PLATFORM - RENDER BLUEPRINT (render.yaml)
# ==============================================================================
# Deploy the entire platform (Frontend + Backend + Automation + All 4 Mock Insurers + Voice Agent)
# on Render with 1-Click.
#
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

services:
  # ============================================================================
  # 1. UNIFIED FULL-STACK PRODUCTION PLATFORM (RECOMMENDED)
  # ----------------------------------------------------------------------------
  # Everything runs in a single high-performance Docker container on Render:
  # - React Vite Web App (Nginx Reverse Proxy on Render's $PORT)
  # - Core Backend API (FastAPI on internal port 8000 via /api/v1)
  # - Policy Automation & OCR Service (Port 8001 via /automation/)
  # - Insurer A: ICICI Lombard (Port 9001 via /insurer-a/)
  # - Insurer B: ACKO General (Port 9002 via /insurer-b/)
  # - Insurer C: TATA AIG Assurance (Port 9003 via /insurer-c/)
  # - Insurer D: HDFC ERGO (Port 9004 via /insurer-d/)
  # - Realtime AI Voice Agent / Advisor (Port 8011 via /voice-agent/)
  #
  # Advantages:
  # - 100% completely working without separate microservice cold starts
  # - Fits in Render Free Tier (1 Web Service = 24/7 uptime without running out of free hours)
  # - Zero Mixed Content errors (all iframes and API calls are on the same HTTPS domain)
  # - Zero CORS configuration issues
  # ============================================================================
  - type: web
    name: synova-platform
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: CORS_ORIGINS
        value: "*"
