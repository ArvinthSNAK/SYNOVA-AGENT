<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDFC Ergo General Insurance - Motor Shield Quote</title>
    <style>
        :root {
            --hdfc-red: #E31837;
            --hdfc-slate: #1E293B;
            --bg-gray: #F8FAFC;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: #334155;
        }
        .header {
            background-color: var(--hdfc-slate);
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--hdfc-red);
        }
        .logo-box {
            background-color: var(--hdfc-red);
            color: white;
            font-weight: 800;
            font-size: 20px;
            padding: 4px 12px;
            border-radius: 4px;
        }
        .container {
            max-width: 580px;
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
        }
        h2 {
            color: var(--hdfc-slate);
            margin-top: 0;
            font-size: 22px;
            border-bottom: 2px solid var(--hdfc-red);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #475569;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: var(--hdfc-red);
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #c4122d;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="logo-box">HDFC ERGO</div>
            <span style="font-size: 14px;">Motor Shield Insurance</span>
        </div>
        <span style="font-size: 12px; opacity: 0.8;">Instant Online Quote</span>
    </div>

    <div class="container">
        <h2>Motor Insurance Quote Calculator</h2>

        {% if error %}
            <div style="color: red; margin-bottom: 15px;"><strong>Error:</strong> {{ error }}</div>
        {% endif %}

        <form method="post" action="/quote">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" name="customer_name" required>
            </div>

            <div class="form-group">
                <label>Vehicle Registration Number</label>
                <input type="text" name="vehicle_registration" required>
            </div>

            <div class="form-group">
                <label>Select Product Plan</label>
                <select name="product_id" required>
                    {% for product in products %}
                        <option value="{{ product.id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Insured Declared Value - IDV (₹)</label>
                <input type="number" name="idv" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Vehicle Age (Years)</label>
                <input type="number" name="vehicle_age_years" value="2" required>
            </div>

            <div class="form-group">
                <label>No Claim Bonus (%)</label>
                <input type="number" name="ncb_percent" step="0.01" value="20" required>
            </div>

            <div class="form-group">
                <label>Engine Capacity (CC)</label>
                <input type="number" name="engine_capacity_cc" value="1497" required>
            </div>

            <div class="form-group">
                <label>Has Anti-Theft Device Installed?</label>
                <select name="has_anti_theft">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Calculate HDFC Ergo Premium</button>
        </form>
    </div>
</body>
</html>
