<!DOCTYPE html>
<html>
<head>
    <title>SafeGuard Motors - Quote</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 30px; }
        h1 { color: #e94560; }
        form { background: #16213e; padding: 24px; border-radius: 10px; max-width: 500px; }
        label { display: block; margin-top: 14px; color: #a8d8ea; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: #0f3460; color: #eee; border: 1px solid #444; border-radius: 4px; }
        button { margin-top: 18px; background: #e94560; color: white; padding: 10px 28px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>SafeGuard Motors — Get Your Quote</h1>

    {% if error %}
        <p class="error">Error: {{ error }}</p>
    {% endif %}

    <form method="post" action="/quote">
        <label>Customer Name</label>
        <input type="text" name="customer_name" required>

        <label>Vehicle Registration</label>
        <input type="text" name="vehicle_registration" required>

        <label>Product</label>
        <select name="product_id" required>
            {% for product in products %}
                <option value="{{ product.id }}">{{ product.name }}</option>
            {% endfor %}
        </select>

        <label>IDV (₹)</label>
        <input type="number" name="idv" step="0.01" required>

        <label>Vehicle Age (years)</label>
        <input type="number" name="vehicle_age_years" value="0">

        <label>NCB (%)</label>
        <input type="number" name="ncb_percent" step="0.01" value="0">

        <label>Engine Capacity (cc)</label>
        <input type="number" name="engine_capacity_cc" value="1200">

        <label>Anti-Theft Device Installed?</label>
        <select name="has_anti_theft">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <button type="submit">Get Quote</button>
    </form>
</body>
</html>
