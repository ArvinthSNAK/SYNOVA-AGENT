<!DOCTYPE html>
<html>
<head>
    <title>Mock Insurer C - Get a Quote</title>
    <style>
        body { font-family: Georgia, serif; background: #f5f0e8; padding: 30px; }
        h1 { color: #2c5f2d; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; }
        label { font-weight: bold; display: block; margin-top: 12px; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 16px; background: #2c5f2d; color: white; padding: 10px 24px; border: none; cursor: pointer; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>TrustShield Insurance — Motor Quote</h1>

    {% if error %}
        <p class="error">Error: {{ error }}</p>
    {% endif %}

    <form method="post" action="/quote">
        <label>Full Name</label>
        <input type="text" name="customer_name" required>

        <label>Vehicle Registration</label>
        <input type="text" name="vehicle_registration" required>

        <label>Insurance Product</label>
        <select name="product_id" required>
            {% for product in products %}
                <option value="{{ product.id }}">{{ product.name }}</option>
            {% endfor %}
        </select>

        <label>IDV (₹)</label>
        <input type="number" name="idv" step="0.01" required>

        <label>Vehicle Age (years)</label>
        <input type="number" name="vehicle_age_years" value="0">

        <label>NCB (%)</label>
        <input type="number" name="ncb_percent" step="0.01" value="0">

        <label>Engine Capacity (cc)</label>
        <input type="number" name="engine_capacity_cc" value="1200">

        <button type="submit">Calculate Premium</button>
    </form>
</body>
</html>
