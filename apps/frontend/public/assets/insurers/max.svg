<svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="500" rx="72" fill="#002855"/>
  <!-- Max Life Wings / Sunburst Emblem -->
  <g transform="translate(100, 60)">
    <!-- Right Wing / Chevron Orange -->
    <path d="M150 50 L230 110 L180 180 L150 140 Z" fill="#F37021"/>
    <!-- Left Wing / Chevron Dark Orange -->
