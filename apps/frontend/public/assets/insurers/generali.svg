    <circle cx="36" cy="38" r="10" />
    <path d="M30 36 C30 26 38 24 45 28 C50 31 52 38 50 44 C46 50 36 50 30 44 Z" />
    <!-- Winged Plumage extending backward and upward -->
    <path d="M46 38 C52 22 66 18 80 20 C88 22 92 28 88 34 C80 32 72 34 66 40 C72 36 82 36 84 42 C76 42 70 46 64 52 C70 48 76 50 78 56 C70 56 64 62 58 68 L48 58 Z" />
    <!-- Lion Body & Muscular Stance -->
    <path d="M28 44 C28 44 48 44 54 52 L56 70 L48 70 L46 60 L38 60 L36 70 L26 70 L28 44 Z" />
    <!-- Open Gospel Book under Front Paw -->
    <rect x="18" y="62" width="22" height="14" rx="2" fill="#FFFFFF" />
    <line x1="29" y1="62" x2="29" y2="76" stroke="#C8102E" stroke-width="2"/>
    <!-- Tail curved upward -->
    <path d="M56 64 C64 62 68 56 66 50" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>
