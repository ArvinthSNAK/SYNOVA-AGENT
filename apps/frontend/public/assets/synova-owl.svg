<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Premium Royal Blue & Electric Indigo Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Electric Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Intelligent Glowing Eyes Gradient -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Soft Drop Shadow -->
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Protective Hexagonal Shield -->
  <path d="M60 6 L106 28 L106 76 L60 114 L14 76 L14 28 Z" fill="url(#shieldGrad)" filter="url(#royalShadow)"/>

  <!-- Dark Obsidian Inner Silhouette -->
  <path d="M60 12 L98 32 L98 72 L60 106 L22 72 L22 32 Z" fill="#0B0F19" opacity="0.95"/>

  <!-- Owl Horns & Brow Crown -->
  <path d="M26 36 L44 18 L58 38 L60 38 L62 38 L76 18 L94 36 L60 52 Z" fill="url(#cyanGrad)"/>

  <!-- Left Symmetrical Wing -->
  <path d="M24 40 L48 58 L36 90 L24 72 Z" fill="#1E293B"/>
  <path d="M26 44 L44 58 L36 82 Z" fill="url(#cyanGrad)" opacity="0.45"/>

  <!-- Right Symmetrical Wing -->
  <path d="M96 40 L72 58 L84 90 L96 72 Z" fill="#1E293B"/>
  <path d="M94 44 L76 58 L84 82 Z" fill="url(#cyanGrad)" opacity="0.45"/>

  <!-- Owl Chest Plumage / Core Shield Plate -->
  <path d="M48 58 L60 48 L72 58 L68 88 L60 98 L52 88 Z" fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="1.6"/>

  <!-- Left Smart Eye -->
  <circle cx="44" cy="48" r="11" fill="#0B0F19" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="44" cy="48" r="6" fill="url(#eyeGlow)"/>
  <circle cx="44" cy="48" r="2.5" fill="#0B0F19"/>
  <circle cx="42" cy="46" r="1" fill="#FFFFFF"/>

  <!-- Right Smart Eye -->
  <circle cx="76" cy="48" r="11" fill="#0B0F19" stroke="#38BDF8" stroke-width="2.5"/>
  <circle cx="76" cy="48" r="6" fill="url(#eyeGlow)"/>
  <circle cx="76" cy="48" r="2.5" fill="#0B0F19"/>
  <circle cx="74" cy="46" r="1" fill="#FFFFFF"/>

  <!-- Sharp Golden Beak -->
  <polygon points="60,52 54,66 66,66" fill="url(#eyeGlow)"/>
  <polygon points="60,66 56,74 64,74" fill="#D97706"/>

  <!-- Chest Feather Chevron Accents -->
  <path d="M54 74 L60 80 L66 74" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 82 L60 86 L64 82" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
