version: "3.9"

services:
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: synova-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
      - automation-service
    networks:
      - synova-net

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: synova-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - backend_data:/app/uploads
    networks:
      - synova-net

  automation-service:
    build:
      context: ../../apps/automation-service
      dockerfile: Dockerfile
    container_name: synova-automation
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - PORT=8001
    depends_on:
      - backend
    networks:
      - synova-net

  insurer-a:
    build:
      context: ../../apps/mock-insurers/insurer-a
      dockerfile: Dockerfile
    container_name: synova-insurer-a-icici
    restart: unless-stopped
    ports:
      - "9001:9001"
    networks:
      - synova-net

  insurer-b:
    build:
      context: ../../apps/mock-insurers/insurer-b
      dockerfile: Dockerfile
    container_name: synova-insurer-b-acko
    restart: unless-stopped
    ports:
      - "9002:9002"
    networks:
      - synova-net

  insurer-c:
    build:
      context: ../../apps/mock-insurers/insurer-c
      dockerfile: Dockerfile
    container_name: synova-insurer-c-tata
    restart: unless-stopped
    ports:
      - "9003:9003"
    networks:
      - synova-net

  insurer-d:
    build:
      context: ../../apps/mock-insurers/insurer-d
      dockerfile: Dockerfile
    container_name: synova-insurer-d-hdfc
    restart: unless-stopped
    ports:
      - "9004:9004"
    networks:
      - synova-net

networks:
  synova-net:
    driver: bridge

volumes:
  backend_data:
